name: Android CI - STAR Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Detect build system
      id: build-system
      run: |
        echo "=== Checking for build files ==="
        if [ -f "gradlew" ]; then
          echo "build-tool=gradle-wrapper" >> $GITHUB_OUTPUT
          echo "✓ Found gradlew"
        elif [ -f "app/build.gradle.kts" ]; then
          echo "build-tool=gradle-wrapper-in-app" >> $GITHUB_OUTPUT
          echo "✓ Found app/build.gradle.kts but no root gradlew"
        elif [ -f "build.gradle" ] || [ -f "build.gradle.kts" ]; then
          echo "build-tool=gradle" >> $GITHUB_OUTPUT
          echo "✓ Found build.gradle"
        elif [ -f "CMakeLists.txt" ]; then
          echo "build-tool=cmake" >> $GITHUB_OUTPUT
          echo "✓ Found CMakeLists.txt"
        else
          echo "build-tool=unknown" >> $GITHUB_OUTPUT
          echo "⚠ No standard build system detected"
        fi
        
        echo "=== Project structure ==="
        ls -la
        
        echo "=== App directory contents ==="
        if [ -d "app" ]; then
          ls -la app/
        fi

    - name: Fix submodules path
      run: |
        if [ -f "app/.gitmodules" ]; then
          echo "Found .gitmodules in app/ directory"
          git config --file=app/.gitmodules --name-only --get-regexp '^submodule\..*\.path' | while read -r entry; do
            name=$(echo "$entry" | sed 's/submodule\.\(.*\)\.path/\1/')
            path=$(git config --file=app/.gitmodules --get submodule."$name".path)
            url=$(git config --file=app/.gitmodules --get submodule."$name".url)
            echo "Registering submodule: $name at $path from $url"
            git config --file=.gitmodules --add submodule."$name".path "app/$path"
            git config --file=.gitmodules --add submodule."$name".url "$url"
          done
        fi

    - name: Initialize submodules
      run: |
        git submodule update --init --recursive --depth 1
      continue-on-error: true

    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Build with Gradle
      if: steps.build-system.outputs.build-tool != 'unknown'
      run: |
        if [ -f "gradlew" ]; then
          chmod +x gradlew
          ./gradlew clean assembleDebug
        elif [ -f "app/build.gradle.kts" ] || [ -f "app/build.gradle" ]; then
          # Try to use gradle directly if no gradlew
          gradle wrapper
          chmod +x gradlew
          ./gradlew clean assembleDebug
        fi

    - name: Get Git metadata
      id: git-info
      run: |
        echo "short-sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
        echo "branch=$(git rev-parse --abbrev-ref HEAD)" >> $GITHUB_OUTPUT
        echo "timestamp=$(date +%Y%m%d_%H%M%S)" >> $GITHUB_OUTPUT

    - name: Extract version from build.gradle.kts
      id: version-info
      if: success()
      run: |
        if [ -f "app/build.gradle.kts" ]; then
          VERSION=$(cat app/build.gradle.kts | grep versionName | cut -d "=" -f 2 | sed 's/"//g' | xargs)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"
        else
          echo "version=unknown" >> $GITHUB_OUTPUT
        fi

    - name: List build output files
      if: always()
      run: |
        echo "=== Build Outputs ==="
        find . -name "*.apk" -type f 2>/dev/null || echo "No APK files found"
        
        echo "=== Gradle outputs ==="
        ls -lah app/build/outputs/ 2>/dev/null || echo "No app/build/outputs directory"
        
        echo "=== Assets ==="
        ls -lah app/src/main/assets/ 2>/dev/null || echo "No assets directory found"

    - name: Upload Debug APK
      if: success() && hashFiles('app/build/outputs/apk/debug/*.apk') != ''
      uses: actions/upload-artifact@v4
      with:
        name: star-debug-apk-${{ steps.git-info.outputs.short-sha }}
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30

    - name: Generate build summary
      if: always()
      run: |
        cat > build-summary.txt << 'EOF'
        Build Information
        =================
        Repository: Miku-And-Teto/star
        Branch: ${{ steps.git-info.outputs.branch }}
        Commit: ${{ steps.git-info.outputs.short-sha }}
        Version: ${{ steps.version-info.outputs.version }}
        Build Date: ${{ steps.git-info.outputs.timestamp }}
        Build System: ${{ steps.build-system.outputs.build-tool }}
        Build Status: ${{ job.status }}
        EOF
        cat build-summary.txt

    - name: Upload build summary
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-summary-${{ steps.git-info.outputs.short-sha }}
        path: build-summary.txt
        retention-days: 7

    - name: Notify on failure
      if: failure()
      run: echo "::error::Build failed for commit ${{ steps.git-info.outputs.short-sha }}"
