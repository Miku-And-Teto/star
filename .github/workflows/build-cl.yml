name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up JDK 11
      uses: actions/setup-java@v2
      with:
        java-version: '11'

    - name: Download Gradle
      run: |
        wget https://services.gradle.org/distributions/gradle-6.8-bin.zip
        unzip gradle-6.8-bin.zip
        export PATH=$PATH:$GITHUB_WORKSPACE/gradle-6.8/bin

    - name: Run Gradle Wrapper
      run: ./gradlew build
